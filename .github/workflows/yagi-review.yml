name: yagi-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: yagi-agent/actions-yagi@main
        env:
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
        with:
          model: zai/glm-4.7-flash
